  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;top:0;left:0;overflow:visible;\">\n          <sc-for list=\"{{ connectors }}\" as=\"c\" hint-placeholder-count=\"38\">\n            <path d=\"{{ c.d }}\" fill=\"none\" stroke=\"{{ c.color }}\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"{{ c.dash }}\"><\u002Fpath>\n            <path d=\"{{ c.arrow }}\" fill=\"{{ c.color }}\"><\u002Fpath>\n          <\u002Fsc-for>\n        <\u002Fsvg>\n\n        <sc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"34\">\n          <div class=\"fc-node\" style=\"{{ n.posStyle }}\" onclick=\"{{ n.onClick }}\">\n            <sc-if value=\"{{ n.isDiamond }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"{{ n.shadowStyle }}\">\n                <div style=\"{{ n.diamondStyle }}\">\n                  <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;line-height:1.15;color:#6b34d6;text-align:center;padding:0 26px;text-wrap:balance;\">{{ n.short }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ n.isBox }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"{{ n.boxStyle }}\">\n                <div style=\"display:flex;align-items:center;gap:7px;\">\n                  <span style=\"{{ n.numStyle }}\">{{ n.num }}<\u002Fspan>\n                  <sc-if value=\"{{ n.hasBadge }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"{{ n.badgeStyle }}\">{{ n.badge }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;line-height:1.18;color:#172033;text-wrap:balance;\">{{ n.short }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ connLabels }}\" as=\"l\" hint-placeholder-count=\"10\">\n          <div style=\"{{ l.style }}\">{{ l.text }}<\u002Fdiv>\n        <\u002Fsc-for>\n\n      <\u002Fdiv>\n\n      <div style=\"position:absolute;right:18px;bottom:18px;display:flex;align-items:center;gap:8px;z-index:5;\">\n        <div style=\"display:flex;flex-direction:column;background:rgba(28,21,56,.86);border:1px solid rgba(255,255,255,.12);border-radius:13px;overflow:hidden;backdrop-filter:blur(6px);box-shadow:0 8px 22px rgba(0,0,0,.34);\">\n          <button class=\"fc-zoom oe-btn\" onclick=\"{{ onZoomIn }}\" style=\"width:42px;height:40px;border:none;background:transparent;color:#e7e0fb;font-size:22px;font-weight:400;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;\">+<\u002Fbutton>\n          <div style=\"height:1px;background:rgba(255,255,255,.12);\"><\u002Fdiv>\n          <div style=\"height:34px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11.5px;color:#bcb0e6;user-select:none;\">{{ zoomPct }}<\u002Fdiv>\n          <div style=\"height:1px;background:rgba(255,255,255,.12);\"><\u002Fdiv>\n          <button class=\"fc-zoom oe-btn\" onclick=\"{{ onZoomOut }}\" style=\"width:42px;height:40px;border:none;background:transparent;color:#e7e0fb;font-size:24px;font-weight:400;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;\">−<\u002Fbutton>\n        <\u002Fdiv>\n        <button class=\"fc-zoom oe-btn\" onclick=\"{{ onFit }}\" style=\"height:40px;padding:0 14px;border:1px solid rgba(255,255,255,.12);background:rgba(28,21,56,.86);color:#e7e0fb;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 8px 22px rgba(0,0,0,.34);display:flex;align-items:center;gap:6px;\">⤶ Fit<\u002Fbutton>\n      <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"text-align:center;font-size:11.5px;color:#5d6679;font-weight:500;padding:12px 40px 0;\">Scroll to zoom · drag to pan · click any step to open it<\u002Fdiv>\n\n  <footer style=\"max-width:1200px;width:100%;margin:0 auto;padding:40px 40px 48px;margin-top:30px;\">\n    <div style=\"height:1px;background:rgba(255,255,255,.09);margin-bottom:26px;\"><\u002Fdiv>\n    <div style=\"text-align:center;display:flex;flex-direction:column;gap:9px;\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#e9ebf2;\">Mia<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#828ba1;line-height:1.5;\">Built on the official Salesforce Order of Execution Overview (Apex API v64.0, Summer&nbsp;’25).<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#828ba1;font-style:italic;\">Memorise the walk, not the list.<\u002Fdiv>\n      <a href=\"https://paceymia.github.io/Salesforce-Guides/\" class=\"gx-flink\" style=\"font-size:13.5px;color:#5b9bf0;text-decoration:none;font-weight:500;margin-top:2px;transition:color .15s;\">paceymia.github.io/Salesforce-Guides ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ onClose }}\" style=\"position:fixed;inset:0;background:rgba(12,8,30,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:28px;z-index:50;\">\n      <div onclick=\"{{ stop }}\" id=\"fc-modal-scroll\" style=\"width:100%;max-width:660px;max-height:88vh;overflow-y:auto;background:#fbfaf7;border-radius:24px;box-shadow:0 36px 90px rgba(0,0,0,.5);position:relative;\">\n        <div style=\"{{ detail.topStyle }}\"><\u002Fdiv>\n        <button class=\"fc-close oe-btn\" onclick=\"{{ onClose }}\" style=\"position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:11px;border:none;background:#f0edf7;color:#5b5470;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;\">×<\u002Fbutton>\n        <div style=\"padding:30px 38px 36px;\">\n\n          <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:18px;\">\n            <div style=\"{{ detail.hookStyle }}\">{{ detail.hook }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px;\">\n              <span style=\"{{ detail.tagStyle }}\">{{ detail.catLabel }}<\u002Fspan>\n              <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;color:#9aa3b2;\">{{ detail.numLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:0 0 22px;color:#15203a;text-wrap:balance;\">{{ detail.title }}<\u002Fh1>\n\n          <div style=\"{{ detail.analogyBox }}\">\n            <div style=\"{{ detail.analogyLabel }}\">PICTURE THIS<\u002Fdiv>\n            <div style=\"font-size:18px;line-height:1.5;color:#2a2342;font-weight:500;text-wrap:pretty;\">{{ detail.analogy }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ detail.isDecision }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin:20px 0 4px;\">\n              <div style=\"font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#8a93a3;margin-bottom:12px;\">{{ detail.question }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n                <div style=\"display:flex;flex-direction:column;gap:9px;align-items:flex-start;border-radius:15px;padding:15px 16px;border:2px solid #cfe9e0;background:#f1f9f5;\"><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;padding:4px 11px;border-radius:7px;color:#fff;background:#2fa37a;\">YES<\u002Fspan><span style=\"font-size:14.5px;line-height:1.4;color:#28324a;text-wrap:pretty;\">{{ detail.yesLabel }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:9px;align-items:flex-start;border-radius:15px;padding:15px 16px;border:2px solid #f0dcc7;background:#fdf6ee;\"><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;padding:4px 11px;border-radius:7px;color:#fff;background:#d0863c;\">NO<\u002Fspan><span style=\"font-size:14.5px;line-height:1.4;color:#28324a;text-wrap:pretty;\">{{ detail.noLabel }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ detail.is11A }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:20px 0 4px;\">\n              <div style=\"border:1.5px solid #cdeadd;background:#edf8f2;border-radius:15px;padding:15px 16px;\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:#147a53;margin-bottom:10px;\">↻ Runs AGAIN<\u002Fdiv>\n                <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;\">\n                  <sc-for list=\"{{ detail.reRuns }}\" as=\"r\" hint-placeholder-count=\"3\"><li style=\"font-size:13.5px;line-height:1.4;color:#235c44;display:flex;gap:7px;\"><span style=\"color:#34a878;font-weight:700;\">+<\u002Fspan><span>{{ r }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fdiv>\n              <div style=\"border:1.5px solid #f1d9bf;background:#fdf3e8;border-radius:15px;padding:15px 16px;\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:#b4651f;margin-bottom:10px;\">✕ Does NOT re-run<\u002Fdiv>\n                <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;\">\n                  <sc-for list=\"{{ detail.notReRun }}\" as=\"x\" hint-placeholder-count=\"5\"><li style=\"font-size:13.5px;line-height:1.4;color:#8a5417;display:flex;gap:7px;\"><span style=\"color:#d08a3e;font-weight:700;\">−<\u002Fspan><span>{{ x }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;gap:13px;margin-top:22px;padding:16px 18px;background:#f1f3f7;border-radius:15px;\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.1em;color:#5b6678;writing-mode:vertical-rl;transform:rotate(180deg);\">ON THE JOB<\u002Fdiv>\n            <div style=\"font-size:15.5px;line-height:1.55;color:#37425a;text-wrap:pretty;\">{{ detail.scenario }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ detail.hasRollback }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ detail.rollbackBox }}\">\n              <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:9px;\">\n                <span style=\"font-size:18px;line-height:1;\">{{ detail.rollbackIcon }}<\u002Fspan>\n                <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.11em;color:{{ detail.rollbackAccent }};\">{{ detail.rollbackLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;line-height:1.25;color:{{ detail.rollbackAccent }};margin-bottom:8px;text-wrap:balance;\">{{ detail.rollbackTo }}<\u002Fdiv>\n              <div style=\"font-size:14.5px;line-height:1.5;color:{{ detail.rollbackTextColor }};text-wrap:pretty;\">{{ detail.rollbackText }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"{{ detail.examBox }}\">\n            <div style=\"{{ detail.examLabelStyle }}\">{{ detail.examLabel }}<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.55;color:{{ detail.examTextColor }};text-wrap:pretty;\">{{ detail.exam }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid #eceaf3;\">\n            <button class=\"fc-nav oe-btn\" onclick=\"{{ detail.onPrev }}\" style=\"{{ detail.prevStyle }}\">\n              <span style=\"font-size:20px;color:#7c3aed;line-height:1;flex:none;\">←<\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:1px;min-width:0;\">\n                <span style=\"font-size:10px;font-weight:700;letter-spacing:.1em;color:#a59cc4;\">PREVIOUS<\u002Fspan>\n                <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;color:#2a2342;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ detail.prevLabel }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n            <button class=\"fc-nav oe-btn\" onclick=\"{{ detail.onNext }}\" style=\"{{ detail.nextStyle }}\">\n              <span style=\"display:flex;flex-direction:column;gap:1px;min-width:0;align-items:flex-end;\">\n                <span style=\"font-size:10px;font-weight:700;letter-spacing:.1em;color:#a59cc4;\">NEXT<\u002Fspan>\n                <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;color:#2a2342;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ detail.nextLabel }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:20px;color:#7c3aed;line-height:1;flex:none;\">→<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"text-align:center;margin-top:12px;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;color:#aab0bd;\">{{ detail.posLabel }} · use ← → keys<\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}\">\nclass Component extends DCLogic {\n  state = { open:null, scale:0.62, tx:0, ty:0, fitScale:0.62 };\n\n  CATS = {\n    browser:{label:'THE DOORS OPEN',color:'#8a6d1f',bg:'#fbf3da',bar:'#c9a53a'},\n    load:{label:'LOAD',color:'#b85f28',bg:'#fbeede',bar:'#e0934e'},\n    validate:{label:'VALIDATE',color:'#2563c9',bg:'#e8f0fd',bar:'#5b8def'},\n    execute:{label:'EXECUTE',color:'#147a53',bg:'#e6f5ed',bar:'#34a878'},\n    calculate:{label:'CALCULATE',color:'#0e8e99',bg:'#e1f4f5',bar:'#27b3bd'},\n    commit:{label:'SAVE / COMMIT',color:'#475569',bg:'#edeff3',bar:'#7c8ba0'},\n    decision:{label:'A FORK IN THE ROAD',color:'#7c3aed',bg:'#f2ebfd',bar:'#9b6bf0'},\n    stop:{label:'BLOCKED',color:'#b91c1c',bg:'#fce9e9',bar:'#e05656'},\n    done:{label:'COMPLETE',color:'#147a53',bg:'#e6f5ed',bar:'#34a878'}\n  };\n\n  N = {\n    start:{cat:'browser',num:'\\u25B6',hook:'\\uD83D\\uDEAA',title:'You hit Save',\n      analogy:'The doors of an exclusive club swing open. Before you even step inside, the bouncer does ONE quick glance \\u2014 your dependent picklist combos. That is the only check the browser does.',\n      scenario:'You built dependent picklists so State only shows options valid for the chosen Country. Pick a bad combo and the browser stops you instantly \\u2014 the server never even hears about it.',\n      exam:'The ONLY client-side validation is dependent picklists. Required fields and validation rules all wait for the server.',kind:'remember'},\n    n1:{cat:'load',num:'1',hook:'\\uD83D\\uDDC4\\uFE0F',title:'Loads the original record',\n      analogy:'The club pulls your file from the cabinet \\u2014 your \\u201cbefore\\u201d photo. Like a bank teller checking your current balance before processing today\\u2019s deposit.',\n      scenario:'This snapshot is Trigger.old. You use it to ask \\u201cdid Stage just change to Closed Won?\\u201d by comparing old vs new.',\n      exam:'Trigger.old = this loaded original. For a brand-new insert there is no \\u201cold\\u201d version yet.',kind:'remember'},\n    n2:{cat:'load',num:'2',hook:'\\uD83D\\uDCDD',title:'Loads the new values',\n      analogy:'Sticky notes with the user\\u2019s edits get slapped over the file \\u2014 but only on a photocopy in memory. The real cabinet copy is still untouched.',\n      scenario:'Now Trigger.new holds exactly what the user typed. Still nothing has hit the database.',\n      exam:'After this, the record = new values in memory only. The DB write is still five steps away.',kind:'remember'},\n    d1:{cat:'decision',num:'?',hook:'\\uD83D\\uDD00',title:'Which door did you come through?',question:'DID THE SAVE COME FROM A STANDARD UI EDIT PAGE?',\n      analogy:'Two entrances: the grand front lobby (a user clicking Save on a record page) or the quiet staff side-door (an API call, Data Loader, or Apex). Each gets a different security check.',\n      scenario:'A salesperson editing in Lightning walks through the lobby. Your nightly integration inserting 10,000 rows uses the side-door.',\n      yesLabel:'Front lobby (UI) \\u2192 full security scan (2A)',noLabel:'Side-door (API / Apex) \\u2192 quick badge check (2B \\u2192 2C)',\n      exam:'UI saves get layout + required-field checks. API/Apex saves skip layout rules entirely \\u2014 a classic exam contrast.',kind:'trap'},\n    n2a:{cat:'validate',num:'2A',hook:'\\uD83D\\uDEC2',title:'Full system validation',\n      analogy:'The front-lobby metal detector \\u2014 the thorough scan: required fields, formats, lengths, and page-layout rules all get checked.',\n      scenario:'A rep leaves a layout-required \\u201cLost Reason\\u201d blank. They are stopped right here, in the lobby.',\n      exam:'Layout-specific rules and layout-level required fields ONLY happen on the UI path.',kind:'remember'},\n    n2b:{cat:'validate',num:'2B',hook:'\\uD83E\\uDEAA',title:'FK & restricted picklists only',\n      analogy:'Staff side-door: a quick badge swipe. No full body scan.',\n      scenario:'Your Data Loader insert will not fail just because a field is required ON THE PAGE LAYOUT \\u2014 layout rules are skipped for the API.',\n      exam:'API/Apex only checks FKs, restricted picklists, and universally-required (field-definition) fields.',kind:'trap'},\n    n2c:{cat:'validate',num:'2C',hook:'\\uD83E\\uDE9E',title:'Self-reference check',\n      analogy:'Making sure your \\u201cemergency contact\\u201d is not\\u2026 yourself. A custom lookup cannot point the record back at its own object.',\n      scenario:'A quick custom foreign-key sanity check, just before triggers run.',\n      exam:'Verifies custom FKs do not reference the object itself.',kind:'remember'},\n    d2:{cat:'decision',num:'?',hook:'\\uD83D\\uDCCB',title:'Line item or new User?',question:'MULTI-LINE ITEMS, OR A USER-OBJECT SAVE FROM THE UI?',\n      analogy:'Some guests get their paperwork stamped EARLY at the door: line items (Quote / Opportunity Line Items) and Users signing up at the front desk.',\n      scenario:'Adding Opportunity Line Items to a Quote? Their custom validation rules fire sooner than for a normal object.',\n      yesLabel:'YES \\u2192 run custom validation now (2D)',noLabel:'NO \\u2192 on to before-save flows (3)',\n      exam:'Edge case: line items and User-UI saves run custom validation early.',kind:'remember'},\n    n2d:{cat:'validate',num:'2D',hook:'\\uD83D\\uDCDC',title:'Custom validation (early)',\n      analogy:'Line items get their rulebook checked at the door instead of inside.',\n      scenario:'Your validation rule on Quote Line Item runs here, ahead of the usual spot.',\n      exam:'Only for multi-line items and User-UI saves.',kind:'remember'},\n    n3:{cat:'execute',num:'3',hook:'\\uD83E\\uDD1D',title:'Before-save flows',\n      analogy:'A free, super-fast assistant tidies your form for you BEFORE any official looks \\u2014 no paperwork trip required, they just fix it right in your hand.',\n      scenario:'A before-save record-triggered flow stamps \\u201cDiscount = 10%\\u201d on the same record with ZERO extra DML \\u2014 the cheapest automation there is.',\n      exam:'Before-save flows run BEFORE before-triggers and need no DML to update the same record. Order among flows is not guaranteed.',kind:'remember'},\n    n4:{cat:'execute',num:'4',hook:'\\uD83E\\uDDF0',title:'Before triggers',\n      analogy:'Your personal prep team adjusts your outfit before the photo. You are right there \\u2014 they can change anything on you instantly, no extra trip.',\n      scenario:'A before-insert Apex trigger defaults the Owner or formats a phone number by editing Trigger.new directly \\u2014 no DML needed.',\n      exam:'Before-triggers run AFTER before-save flows. Order between triggers is NOT guaranteed \\u2014 use a handler framework.',kind:'trap'},\n    n5:{cat:'validate',num:'5',hook:'\\uD83D\\uDD0D',title:'Validation runs AGAIN',\n      analogy:'A re-scan \\u2014 because the prep team just touched you. What if they slipped something in? This is where YOUR validation rules actually fire on a normal save.',\n      scenario:'A before-trigger accidentally set Amount to \\u201250. Your validation rule \\u201cAmount must be \\u2265 0\\u201d catches it HERE \\u2014 not earlier.',\n      exam:'Re-run #1. Custom validation rules run here (after before-triggers). Layout rules are NOT repeated for UI saves.',kind:'trap'},\n    n6:{cat:'execute',num:'6',hook:'\\uD83D\\uDC40',title:'Duplicate rules',\n      analogy:'Reception\\u2019s \\u201chave we met before?\\u201d check, scanning the guest book for your face.',\n      scenario:'A duplicate rule matches on Email. It found a Lead who looks just like this new one.',\n      exam:'Duplicate rules run here, right before the save.',kind:'remember'},\n    d3:{cat:'decision',num:'?',hook:'\\uD83D\\uDED1',title:'Block, or wave through?',question:'DUPLICATE FOUND, AND THE RULE\\u2019S ACTION IS BLOCK?',\n      analogy:'Is the bouncer set to \\u201cturn you away\\u201d \\u2014 or just \\u201cjot it down and wave you in\\u201d?',\n      scenario:'Block action = the save fails. Allow action = it logs the dupe and lets you through.',\n      yesLabel:'BLOCK \\u2192 the record is NOT saved. Stop.',noLabel:'Allow / no dupe \\u2192 save the record (7)',\n      exam:'A Block action stops EVERYTHING \\u2014 no save, no after-triggers, no workflow. Allow just warns.',kind:'trap'},\n    notsaved:{cat:'stop',num:'\\u2715',hook:'\\u26D4',title:'Bounced at the door',\n      analogy:'Turned away. Go home. The party goes on without you \\u2014 nothing else runs.',\n      scenario:'A blocking duplicate rule rejected the insert.',\n      exam:'No save, no after-triggers, no workflow, no commit.',kind:'remember'},\n    n7:{cat:'commit',num:'7',hook:'\\u270F\\uFE0F',title:'Saved \\u2014 but in PENCIL',\n      analogy:'You are written into the guest book in PENCIL. You officially exist (you even get a name tag, your Id) \\u2014 but it can still be fully erased.',\n      scenario:'The record now has an Id, so after-triggers can use it. But if anything later throws, the whole thing rubs out.',\n      exam:'Saved \\u2260 committed. The pen (permanent ink) comes at Step 19.',kind:'trap'},\n    n8:{cat:'execute',num:'8',hook:'\\uD83C\\uDFF7\\uFE0F',title:'After triggers',\n      analogy:'Now you have a name tag (your Id), so staff can seat you and link your plus-ones. But you are \\u201cset\\u201d \\u2014 changing yourself now means filling out a new form (DML).',\n      scenario:'An after-insert trigger creates a related Task and stamps it with the new record\\u2019s Id.',\n      exam:'After-triggers see the Id; fields are read-only without DML.',kind:'remember'},\n    d4:{cat:'decision',num:'?',hook:'\\uD83E\\uDE9E',title:'Are you a reflection?',question:'IS THIS A RECURSIVE SAVE?',\n      analogy:'Are you the real guest walking in \\u2014 or just a reflection caused by SOMEONE ELSE entering (a roll-up recalculating a parent)? Reflections skip the party games.',\n      scenario:'Saving a child makes its parent\\u2019s roll-up recalc \\u2192 the parent his._up);\n    this._st=st;\n  }\n  componentWillUnmount(){\n    window.removeEventListener('resize',this._fit);\n    window.removeEventListener('keydown',this._key);\n    window.removeEventListener('pointermove',this._move);\n    window.removeEventListener('pointerup',this._up);\n    if(this._st){ this._st.removeEventListener('wheel',this._wheel); this._st.removeEventListener('pointerdown',this._down); }\n  }\n  fit(){\n    const st=document.getElementById('fc-stage'); if(!st) return;\n    const pad=44;\n    const avW=st.clientWidth-pad, avH=st.clientHeight-pad;\n    const sc=Math.min(avW/1680, avH/1140);\n    if(sc<=0) return;\n    const tx=(st.clientWidth-1680*sc)/2, ty=(st.clientHeight-1140*sc)/2;\n    this.setState({scale:sc, fitScale:sc, tx, ty});\n  }\n  zoomAt(factor,cx,cy){\n    const s=this.state;\n    const ns=Math.max(s.fitScale*0.6, Math.min(4.5, s.scale*factor));\n    const k=ns/s.scale;\n    this.setState({ scale:ns, tx:cx-(cx-s.tx)*k, ty:cy-(cy-s.ty)*k });\n  }\n  zoomCenter(factor){\n    const st=document.getElementById('fc-stage'); if(!st) return;\n    this.zoomAt(factor, st.clientWidth/2, st.clientHeight/2);\n  }\n\n  go(delta){\n    const i=this.SEQ.indexOf(this.state.open);\n    if(i<0) return;\n    const j=i+delta;\n    if(j<0||j>=this.SEQ.length) return;\n    this.setState({open:this.SEQ[j]});\n    const m=document.getElementById('fc-modal-scroll'); if(m) m.scrollTop=0;\n  }\n\n  anchor(id,side){\n    const b=this.LAYOUT[id];\n    if(side==='R') return [b.x+b.w, b.y+b.h/2];\n    if(side==='L') return [b.x, b.y+b.h/2];\n    if(side==='T') return [b.x+b.w/2, b.y];\n    return [b.x+b.w/2, b.y+b.h];\n  }\n  buildPath(pts){ return 'M '+pts.map(p=>p[0]+' '+p[1]).join(' L '); }\n  arrowPath(b,side){\n    const [x,y]=b, s=8;\n    if(side==='L') return `M ${x} ${y} L ${x-s} ${y-5} L ${x-s} ${y+5} Z`;\n    if(side==='R') return `M ${x} ${y} L ${x+s} ${y-5} L ${x+s} ${y+5} Z`;\n    if(side==='T') return `M ${x} ${y} L ${x-5} ${y-s} L ${x+5} ${y-s} Z`;\n    return `M ${x} ${y} L ${x-5} ${y+s} L ${x+5} ${y+s} Z`;\n  }\n\n  renderVals(){\n    const C=this.CATS, S=this.state;\n\n    const connectors=this.CONN.map(c=>{\n      const a=this.anchor(c.f,c.fs), b=this.anchor(c.t,c.ts);\n      const pts=[a,...(c.mids||[]),b];\n      const col=this.COLORS[c.k]||this.COLORS.n;\n      return { d:this.buildPath(pts), arrow:this.arrowPath(b,c.ts), color:col, dash:(c.k==='skip'?'8 6':'0') };\n    });\n\n    const connLabels=this.CONN.filter(c=>c.lab).map(c=>{\n      const col=this.COLORS[c.k]||this.COLORS.n;\n      const skip=c.k==='skip';\n      return { text:c.lab.t,\n        style:`position:absolute;left:${c.lab.x}px;top:${c.lab.y}px;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em;padding:3px 9px;border-radius:7px;white-space:nowrap;color:#fff;background:${col};box-shadow:0 2px 6px rgba(0,0,0,.18);${skip?'background:#fff;color:#6b34d6;border:1.5px dashed #9b6bf0;':''}` };\n    });\n\n    const nodes=Object.keys(this.LAYOUT).map(id=>{\n      const b=this.LAYOUT[id], nd=this.N[id], cc=C[nd.cat];\n      const isD=!!b.d;\n      const posStyle=`position:absolute;left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;`;\n      const bg=this.BADGE[id];\n      let badgeStyle='';\n      if(bg){\n        const pal = bg.tone==='undo' ? ['#fbe9e9','#c0392b','#f0cccc']\n                  : bg.tone==='pencil' ? ['#fbf3da','#8a6d1f','#ecdca6']\n                  : ['#eceff4','#475569','#d3d9e2'];\n        badgeStyle=`font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.02em;padding:2px 7px;border-radius:6px;white-space:nowrap;background:${pal[0]};color:${pal[1]};border:1px solid ${pal[2]};`;\n      }\n      return {\n        isDiamond:isD, isBox:!isD, short:this.SHORT[id]||nd.title, num:nd.num,\n        onClick:()=>{ if(this._moved) return; this.setState({open:id}); },\n        posStyle,\n        shadowStyle:`width:100%;height:100%;filter:drop-shadow(0 7px 12px rgba(40,20,90,.20));`,\n        diamondStyle:`width:100%;height:100%;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:${cc.bg};display:flex;align-items:center;justify-content:center;`,\n        boxStyle:`width:100%;height:100%;background:${cc.bg};border:2px solid ${cc.bar};border-radius:14px;box-shadow:0 5px 14px rgba(40,20,90,.12);padding:11px 14px;display:flex;flex-direction:column;justify-content:center;gap:7px;`,\n        numStyle:`flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:7px;background:${cc.color};color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:${(''+nd.num).length>2?10:12}px;`,\n        hasBadge:!!bg, badge:bg?bg.t:'', badgeStyle\n      };\n    });\n\n    const legend=['load','validate','execute','calculate','commit','decision','stop'].map(k=>({\n      label:C[k].label==='SAVE / COMMIT'?'Save/Commit':(C[k].label==='A FORK IN THE ROAD'?'Decision':(C[k].label==='BLOCKED'?'Blocked':C[k].label.charAt(0)+C[k].label.slice(1).toLowerCase())),\n      swatch:`width:13px;height:13px;border-radius:4px;background:${C[k].bg};border:2px solid ${C[k].bar};display:inline-block;`\n    }));\n\n    const scale=S.scale||0.62;\n    const canvasStyle=`position:absolute;top:0;left:0;width:1680px;height:1140px;transform:translate(${S.tx}px,${S.ty}px) scale(${scale});transform-origin:top left;`;\n    const zoomPct=Math.round(scale*100)+'%';\n\n    // detail\n    let detail={topStyle:'height:7px;background:#ccc;'};\n    const id=S.open;\n    if(id){\n      const nd=this.N[id], cat=C[nd.cat], isDec=nd.cat==='decision', trap=nd.kind==='trap';\n      detail={\n        hook:nd.hook, topStyle:`height:7px;background:${cat.bar};`,\n        hookStyle:`width:72px;height:72px;border-radius:20px;background:${cat.bg};display:flex;align-items:center;justify-content:center;font-size:38px;flex:none;box-shadow:inset 0 0 0 1.5px ${this.hex(cat.bar,.4)};`,\n        tagStyle:`display:inline-flex;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;padding:5px 11px;border-radius:999px;color:${cat.color};background:${cat.bg};`,\n        catLabel:cat.label,\n        numLabel: nd.num&&!isDec&&nd.cat!=='browser'&&nd.cat!=='done'&&nd.cat!=='stop' ? 'STEP '+nd.num : (isDec?'DECISION':(nd.cat==='browser'?'THE START':(nd.cat==='stop'?'DEAD END':'THE FINISH'))),\n        title:nd.title, analogy:nd.analogy, scenario:nd.scenario,\n        analogyBox:`background:${cat.bg};border-radius:16px;padding:18px 20px;border:1px solid ${this.hex(cat.bar,.35)};`,\n        analogyLabel:`font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;color:${cat.color};margin-bottom:9px;`,\n        isDecision:isDec, question:nd.question, yesLabel:nd.yesLabel, noLabel:nd.noLabel,\n        is11A:!!nd.is11A, reRuns:nd.reRuns||[], notReRun:nd.notReRun||[],\n        exam:nd.exam, examLabel:trap?'\\u26A0  EXAM TRAP':'\\uD83D\\uDCA1  REMEMBER',\n        examBox:`margin-top:14px;border-left:3px solid ${trap?'#e0934e':'#3b7bf0'};background:${trap?'#fdf3e8':'#edf3fe'};border-radius:0 13px 13px 0;padding:14px 18px;`,\n        examLabelStyle:`font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;color:${trap?'#b4521f':'#2860c9'};margin-bottom:6px;`,\n        examTextColor:trap?'#7a3d14':'#234a8f'\n      };\n      const rb=this.ROLLBACK[id];\n      if(rb){\n        const ink=rb.tone==='ink';\n        detail.hasRollback=true; detail.rollbackTo=rb.to; detail.rollbackText=rb.text;\n        detail.rollbackIcon=ink?'\\uD83D\\uDD8B\\uFE0F':'\\u21A9\\uFE0F';\n        detail.rollbackLabel=ink?'PAST THIS LINE \\u2014 NO ROLLBACK':'IF IT FAILS HERE \\u2192 ROLLS BACK TO';\n        detail.rollbackAccent=ink?'#475569':'#b3261e';\n        detail.rollbackTextColor=ink?'#3f4a5e':'#7a2b27';\n        detail.rollbackBox=`margin-top:14px;border:1.5px solid ${ink?'#dadfe6':'#f3cfcf'};background:${ink?'#f4f6f9':'#fcf0f0'};border-radius:15px;padding:15px 18px;`;\n      } else detail.hasRollback=false;\n\n      // prev / next nav\n      const si=this.SEQ.indexOf(id);\n      const prevId=si>0?this.SEQ[si-1]:null;\n      const nextId=si>=0&&si<this.SEQ.length-1?this.SEQ[si+1]:null;\n      const baseBtn='flex:1;display:flex;align-items:center;gap:10px;padding:12px 16px;border:1.5px solid #e3def0;background:#fff;border-radius:13px;cursor:pointer;font-family:inherit;text-align:left;min-width:0;transition:background .14s,border-color .14s;';\n      const offBtn='flex:1;display:flex;align-items:center;gap:10px;padding:12px 16px;border:1.5px solid #eee9f0;background:#f6f4fb;border-radius:13px;cursor:default;opacity:.45;min-width:0;';\n      detail.hasPrev=!!prevId; detail.hasNext=!!nextId;\n      detail.prevStyle=prevId?baseBtn:offBtn; detail.nextStyle=nextId?baseBtn+'justify-content:flex-end;text-align:right;':offBtn+'justify-content:flex-end;';\n      detail.prevLabel=prevId?this.SHORT[prevId]:''; detail.nextLabel=nextId?this.SHORT[nextId]:'';\n      detail.prevNum=prevId?(''+this.N[prevId].num):''; detail.nextNum=nextId?(''+this.N[nextId].num):'';\n      detail.onPrev=()=>this.go(-1); detail.onNext=()=>this.go(1);\n      detail.posLabel=(si+1)+' / '+this.SEQ.length;\n    }\n\n    return {\n      connectors, connLabels, nodes, legend, canvasStyle, zoomPct,\n      onZoomIn:()=>this.zoomCenter(1.25),\n      onZoomOut:()=>this.zoomCenter(1/1.25),\n      onFit:()=>this.fit(),\n      isOpen:!!id, detail,\n      onClose:()=>this.setState({open:null}),\n      stop:(e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); }\n    };\n  }\n\n  hex(h,a){const n=h.replace('#','');return `rgba(${parseInt(n.substr(0,2),16)},${parseInt(n.substr(2,2),16)},${parseInt(n.substr(4,2),16)},${a})`;}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
