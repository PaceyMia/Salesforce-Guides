name: Fetch latest YouTube uploads

on:
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch channel feed
        run: node scripts/fetch-youtube.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/youtube.json; then
            git add data/youtube.json
            git commit -m "chore: refresh latest YouTube uploads"
            git push
          else
            echo "No changes to data/youtube.json"
          fi
